<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ko Htet Movie Recap Video Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; }
        h1 { font-size: 20px; color: #f43f5e; text-align: center; margin-bottom: 20px; }
        .card { background: #0f172a; border: 2px dashed #334155; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
        input[type="file"] { display: none; }
        .btn { display: inline-block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 8px; }
        .btn-primary { background: #f43f5e; color: white; }
        .btn-secondary { background: #334155; color: white; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
        #videoPreviewContainer { display: none; background: #0f172a; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        video { width: 100%; border-radius: 6px; margin-bottom: 10px; }
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; color: #cbd5e1; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 Ko Htet Video Studio</h1>
    
    <div class="card">
        <h3>📤 1. Upload Video File</h3>
        <p style="font-size: 12px; color: #94a3b8; margin: 8px 0;">(Authorized Movie / Clip MP4 File)</p>
        <label for="videoUpload" class="btn btn-secondary">Select Video File</label>
        <input type="file" id="videoUpload" accept="video/*" onchange="handleVideoSelect(event)">
    </div>

    <div class="card">
        <h3>🔗 2. Enter Authorized Video Source</h3>
        <input type="text" id="videoUrl" placeholder="Paste Direct Video URL...">
    </div>

    <div id="videoPreviewContainer">
        <video id="videoPlayer" controls></video>
        <div class="info-grid">
            <div><b>File Name:</b> <span id="fileName">-</span></div>
            <div><b>Size:</b> <span id="fileSize">-</span></div>
            <div><b>Duration:</b> <span id="duration">-</span></div>
            <div><b>Resolution:</b> <span id="resolution">-</span></div>
        </div>
        <button class="btn btn-primary" style="margin-top: 15px;" onclick="alert('Proceeding to Pipeline Processing...')">🔍 START ANALYSIS</button>
    </div>
</div>

<script>
    function handleVideoSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        document.getElementById('fileName').innerText = file.name;
        document.getElementById('fileSize').innerText = (file.size / (1024 * 1024)).toFixed(2) + ' MB';

        const videoPlayer = document.getElementById('videoPlayer');
        videoPlayer.src = URL.createObjectURL(file);
        
        videoPlayer.onloadedmetadata = function() {
            document.getElementById('duration').innerText = Math.round(videoPlayer.duration) + ' seconds';
            document.getElementById('resolution').innerText = videoPlayer.videoWidth + 'x' + videoPlayer.videoHeight;
            document.getElementById('videoPreviewContainer').style.display = 'block';
        };
    }
</script>

</body>
</html>
