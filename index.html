<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ko Htet Movie Recap Video Studio</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 16px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 12px; }
        h1 { font-size: 20px; color: #f43f5e; text-align: center; margin-bottom: 20px; }
        .card { background: #0f172a; border: 2px dashed #334155; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 15px; }
        input[type="file"] { display: none; }
        .btn { display: inline-block; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; margin-top: 8px; }
        .btn-primary { background: #f43f5e; color: white; }
        .btn-secondary { background: #334155; color: white; }
        input[type="text"] { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎬 Ko Htet Video Studio</h1>
    
    <div class="card">
        <h3>📤 1. Upload Video File</h3>
        <p style="font-size: 12px; color: #94a3b8; margin: 8px 0;">(Authorized Movie / Clip MP4 File)</p>
        <label for="videoUpload" class="btn btn-secondary">Select Video File</label>
        <input type="file" id="videoUpload" accept="video/*">
    </div>

    <div class="card">
        <h3>🔗 2. Enter Authorized Video Source</h3>
        <input type="text" id="videoUrl" placeholder="Paste Direct Video URL...">
    </div>

    <button class="btn btn-primary" onclick="alert('Proceeding to Step 2...')">🎬 CREATE NEW VIDEO PROJECT</button>
</div>

</body>
</html>
